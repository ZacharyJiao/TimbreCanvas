name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Lint Python
        run: uvx --from ruff==0.15.6 ruff check RuntimeHost Installer

      - name: Test runtime and installer
        env:
          PYTHONPATH: RuntimeHost:Installer
        run: uvx --from pytest==9.0.3 pytest RuntimeHost/tests Installer/tests -q

      - name: Test Swift app
        run: swift test --package-path App

      - name: Package app and verify runtime host
        run: |
          ./script/package_app.sh --debug
          test -f "dist/TimbreCanvas.app/Contents/Resources/RuntimeHost/timbrecanvas_runtime/main.py"
          test ! -e "dist/TimbreCanvas.app/Contents/Resources/RuntimeHost/timbrecanvas_runtime/__pycache__"

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
