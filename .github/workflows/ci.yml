name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Lint Python
        run: uvx --from ruff==0.15.6 ruff check RuntimeHost Installer

      - name: Test runtime and installer
        env:
          PYTHONPATH: RuntimeHost:Installer
        run: uvx --from pytest==9.0.3 pytest RuntimeHost/tests Installer/tests -q

      - name: Test Swift app
        run: swift test --package-path App

      - name: Package app and verify runtime host
        run: |
          ./script/package_app.sh --debug
          test -f "dist/TimbreCanvas.app/Contents/Resources/RuntimeHost/timbrecanvas_runtime/main.py"
          test ! -e "dist/TimbreCanvas.app/Contents/Resources/RuntimeHost/timbrecanvas_runtime/__pycache__"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
