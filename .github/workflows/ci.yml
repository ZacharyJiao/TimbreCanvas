name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "assets/readme/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "assets/readme/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Lint Python
        run: uvx --from ruff==0.15.6 ruff check RuntimeHost Installer

      - name: Test runtime and installer
        env:
          PYTHONPATH: RuntimeHost:Installer
        run: uvx --from pytest==9.0.3 pytest RuntimeHost/tests Installer/tests -q

      - name: Test Swift app
        run: swift test --package-path App

      - name: Package app and verify runtime host
        run: |
          ./script/package_app.sh --debug
          test -f "dist/TimbreCanvas.app/Contents/Resources/RuntimeHost/timbrecanvas_runtime/main.py"
          test ! -e "dist/TimbreCanvas.app/Contents/Resources/RuntimeHost/timbrecanvas_runtime/__pycache__"

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
