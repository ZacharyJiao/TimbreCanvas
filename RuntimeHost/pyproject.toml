[project]
name = "timbrecanvas-runtime-host"
version = "0.1.0"
description = "Model-neutral resident inference host for TimbreCanvas"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
