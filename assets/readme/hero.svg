<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">TimbreCanvas</title>
  <desc id="desc">本地优先的原生 macOS 语音创作工具：文字与音色经过情绪控制和常驻 IndexTTS 2 MLX 推理进程，在本地生成 WAV 音频。</desc>

  <defs>
    <pattern id="paper-fibers" width="96" height="74" patternUnits="userSpaceOnUse">
      <path d="M8 18c14-7 22 3 35-3M58 52c11-5 18 1 29-2M21 65c7-3 12-2 17 0"
            fill="none" stroke="#292926" stroke-width="1" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#F9F7F1"/>
  <rect width="1200" height="420" rx="24" fill="url(#paper-fibers)"/>
  <path d="M26 18c34 4 66-5 99 0 37 5 67-4 105 0 35 4 70-4 106 0 37 4 68-4 104 0 35 4 72-4 108 0 37 4 72-4 108 0 37 4 67-4 104 0 35 4 71-4 108 0 36 4 68-4 105 0 36 4 68-4 101 0"
        fill="none" stroke="#292926" stroke-width="1.25" opacity="0.18"/>
  <path d="M26 402c34-4 66 5 99 0 37-5 67 4 105 0 35-4 70 4 106 0 37-4 68 4 104 0 35-4 72 4 108 0 37-4 72 4 108 0 37-4 67 4 104 0 35-4 71 4 108 0 36-4 68 4 105 0 36-4 68 4 101 0"
        fill="none" stroke="#292926" stroke-width="1.25" opacity="0.18"/>

  <g id="title-block" transform="translate(64 52)">
    <g aria-hidden="true" transform="translate(0 0)">
      <rect x="0" y="10" width="7" height="18" rx="3.5" fill="#294FC7"/>
      <rect x="13" y="5" width="7" height="28" rx="3.5" fill="#294FC7"/>
      <rect x="26" y="0" width="7" height="38" rx="3.5" fill="#294FC7"/>
      <rect x="39" y="6" width="7" height="26" rx="3.5" fill="#294FC7"/>
      <rect x="52" y="11" width="7" height="16" rx="3.5" fill="#294FC7"/>
    </g>
    <text x="78" y="25" fill="#62615B" font-size="18" font-weight="650"
          letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      NATIVE macOS · LOCAL VOICE STUDIO
    </text>

    <g id="project-title" font-size="70" font-weight="760" letter-spacing="-2.4"
       font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      <text x="0" y="112" fill="#292926" textLength="213" lengthAdjust="spacingAndGlyphs">Timbre</text>
      <text x="213" y="112" fill="#294FC7" textLength="229" lengthAdjust="spacingAndGlyphs">Canvas</text>
    </g>

    <text x="0" y="167" fill="#292926" font-size="27" font-weight="620"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      把文字、音色与情绪，绘成只留在本地的声音。
    </text>
    <text x="0" y="205" fill="#62615B" font-size="21" font-weight="430"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      SwiftUI 纸感工作台 · IndexTTS 2 MLX · 常驻推理进程
    </text>

    <g id="metadata" transform="translate(0 252)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650">
      <rect width="176" height="42" rx="7" fill="#294FC7"/>
      <text x="18" y="27" fill="#FFFFFF">APPLE SILICON</text>

      <rect x="188" width="132" height="42" rx="7" fill="none" stroke="#292926" stroke-opacity="0.30"/>
      <text x="206" y="27" fill="#292926">macOS 14+</text>

      <rect x="332" width="198" height="42" rx="7" fill="none" stroke="#292926" stroke-opacity="0.30"/>
      <text x="350" y="27" fill="#292926">LOCAL INFERENCE</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(715 42)">
    <rect width="421" height="336" rx="13" fill="#FCFBF8" stroke="#292926" stroke-opacity="0.28"/>
    <text x="24" y="33" fill="#62615B" font-size="18" font-weight="700" letter-spacing="1.4"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">创作路径 / LOCAL PIPELINE</text>

    <g transform="translate(24 52)">
      <rect width="373" height="58" rx="8" fill="#F9F7F1" stroke="#292926" stroke-opacity="0.20"/>
      <text x="18" y="24" fill="#62615B" font-size="18" font-weight="650"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 · 文字与音色</text>
      <text x="18" y="47" fill="#292926" font-size="20" font-weight="580"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">中文 / English · 官方示例 / 自建音色</text>
    </g>

    <path d="M210 110v15" stroke="#294FC7" stroke-width="2"/>
    <circle cx="210" cy="127" r="3.5" fill="#294FC7"/>

    <g transform="translate(24 126)">
      <rect width="373" height="58" rx="8" fill="#F9F7F1" stroke="#292926" stroke-opacity="0.20"/>
      <text x="18" y="24" fill="#62615B" font-size="18" font-weight="650"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 · 塑造表达</text>
      <text x="18" y="47" fill="#292926" font-size="20" font-weight="580"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">8 维情绪 · 强度 · 语速 · 完整采样参数</text>
    </g>

    <path d="M210 184v15" stroke="#294FC7" stroke-width="2"/>
    <circle cx="210" cy="201" r="3.5" fill="#294FC7"/>

    <g transform="translate(24 200)">
      <rect width="373" height="58" rx="8" fill="#294FC7"/>
      <circle cx="25" cy="29" r="6" fill="#F9F7F1"/>
      <text x="43" y="27" fill="#FFFFFF" font-size="21" font-weight="720"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">IndexTTS 2</text>
      <text x="43" y="47" fill="#DCE4FF" font-size="18" font-weight="560"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MLX 常驻推理进程 · READY</text>
    </g>

    <g transform="translate(24 274)">
      <g aria-hidden="true" fill="#ED5C40">
        <rect x="0" y="13" width="7" height="16" rx="3.5"/>
        <rect x="13" y="7" width="7" height="28" rx="3.5"/>
        <rect x="26" y="1" width="7" height="40" rx="3.5"/>
        <rect x="39" y="8" width="7" height="26" rx="3.5"/>
        <rect x="52" y="13" width="7" height="16" rx="3.5"/>
      </g>
      <text x="80" y="29" fill="#292926" font-size="21" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">WAV · 保留在本地</text>
      <path d="M288 20h58m0 0-10-8m10 8-10 8" fill="none" stroke="#292926" stroke-width="2"/>
    </g>
  </g>

  <path d="M1139 420h61v-61z" fill="#ED5C40"/>
  <path d="M1139 420c19-10 39-30 61-61" fill="none" stroke="#292926" stroke-opacity="0.18"/>
</svg>
